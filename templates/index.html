<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌱 Smart Crop + Circular Waste-to-Wealth Wheel 🌱</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<style>
body {
  font-family: 'Roboto', sans-serif;
  background: linear-gradient(135deg, #11998e, #38ef7d);
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
  color: #fff;
}

h1 {
  text-align: center;
  font-size: 2.5rem;
  margin-bottom: 20px;
  text-shadow: 2px 2px 5px #000;
}

.card {
  background: rgba(255,255,255,0.1);
  padding: 25px;
  border-radius: 20px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.3);
  width: 100%;
  max-width: 600px;
  text-align: center;
}

input {
  width: 90%;
  padding: 12px;
  margin: 8px 0;
  border-radius: 12px;
  border: none;
  font-size: 16px;
}

button {
  background: linear-gradient(to right, #ff512f, #dd2476);
  padding: 14px 25px;
  border: none;
  border-radius: 12px;
  font-size: 18px;
  cursor: pointer;
  color: #fff;
  margin-top: 10px;
  transition: 0.3s;
}

button:hover {
  transform: scale(1.05);
  box-shadow: 0 5px 20px rgba(0,0,0,0.3);
}

.result {
  margin-top: 20px;
  font-size: 1.2rem;
  background: rgba(0,0,0,0.3);
  padding: 15px;
  border-radius: 15px;
  line-height: 1.5rem;
}

/* Circular wheel */
.wheel-container {
  position: relative;
  margin-top: 40px;
  width: 300px;
  height: 300px;
}

.stage {
  position: absolute;
  width: 90px;
  height: 90px;
  border-radius: 50%;
  background: linear-gradient(135deg, #f9d423, #ff4e50);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  text-align: center;
  cursor: pointer;
  color: #fff;
  transition: 0.3s, transform 0.3s;
  font-weight: bold;
  font-size: 14px;
}

.stage.active {
  background: linear-gradient(135deg, #00c6ff, #0072ff);
  transform: scale(1.2);
  box-shadow: 0 6px 25px rgba(0,0,0,0.6);
}

/* Position stages in a circle */
#cropStage { top: 0; left: 50%; transform: translateX(-50%); }
#wasteStage { top: 50%; right: 0; transform: translateY(-50%); }
#wealthStage { bottom: 0; left: 50%; transform: translateX(-50%); }
#nextStage { top: 50%; left: 0; transform: translateY(-50%); }

/* Resource icons moving in circular path */
.resource {
  position: absolute;
  top: 50%;
  left: 50%;
  font-size: 20px;
  transform: translate(-50%, -50%);
  animation: spin 4s linear infinite;
}

@keyframes spin {
  0%   { transform: rotate(0deg) translate(120px) rotate(0deg); }
  25%  { transform: rotate(90deg) translate(120px) rotate(-90deg); }
  50%  { transform: rotate(180deg) translate(120px) rotate(-180deg); }
  75%  { transform: rotate(270deg) translate(120px) rotate(-270deg); }
  100% { transform: rotate(360deg) translate(120px) rotate(-360deg); }
}
</style>
</head>
<body>

<h1>🌾 Smart Crop + Circular Waste-to-Wealth Wheel 🌾</h1>

<div class="card">
  <form id="cropForm">
    <input type="number" name="N" placeholder="Nitrogen (N)" step="0.1" required>
    <input type="number" name="P" placeholder="Phosphorus (P)" step="0.1" required>
    <input type="number" name="K" placeholder="Potassium (K)" step="0.1" required>
    <input type="number" name="temperature" placeholder="Temperature (°C)" step="0.1" required>
    <input type="number" name="humidity" placeholder="Humidity (%)" step="0.1" required>
    <input type="number" name="ph" placeholder="Soil pH" step="0.1" required>
    <input type="number" name="rainfall" placeholder="Rainfall (mm)" step="0.1" required>
    <button type="submit">Predict Crop 🌱</button>
  </form>

  <div class="result" id="result"></div>

  <div class="wheel-container" id="wheel">
    <div class="stage" id="cropStage">🌾 Crop / பயிர்</div>
    <div class="stage" id="wasteStage">♻️ Waste / கழிவு</div>
    <div class="stage" id="wealthStage">💰 Wealth / செல்வம்</div>
    <div class="stage" id="nextStage">🔄 Next Crop / அடுத்த பயிர்</div>
  </div>

  <audio id="soundEffect" src="sound.mp3"></audio>
</div>

<script>
function predictCrop(N, P, K, temp, hum, ph, rain) {
    if (N>100 && P>50) return "Rice";
    if (K>50 && temp>25) return "Wheat";
    if (rain>200) return "Sugarcane";
    return "Maize";
}

const wasteOptions = {
    "Rice": [
        { en: "Rice husk → Bio-fertilizer", ta: "அரிசி கொட்டை → உயிரியல் உரம்" },
        { en: "Rice straw → Compost", ta: "அரிசி புல் → உரம்" }
    ],
    "Wheat": [
        { en: "Wheat straw → Animal feed", ta: "கோதுமை புல் → மிருக உணவு" },
        { en: "Wheat husk → Biofuel", ta: "கோதுமை கொட்டை → உயிரியல் எரிபொருள்" }
    ],
    "Maize": [
        { en: "Corn cob → Biogas", ta: "மக்காச்சோளம் கோப் → உயிரி வாயு" },
        { en: "Corn husk → Compost", ta: "மக்காச்சோளம் தோல் → உரம்" }
    ],
    "Sugarcane": [
        { en: "Bagasse → Biofuel", ta: "கரும்புப் பாக்ஸ் → உயிரியல் எரிபொருள்" },
        { en: "Leaves → Mulch/Compost", ta: "இலைகள் → முள்/உரம்" }
    ],
    "Potato": [
        { en: "Peels → Animal feed or Biogas", ta: "உருண்டை தோல் → மிருக உணவு அல்லது உயிரி வாயு" }
    ],
    "Tomato": [
        { en: "Waste → Compost or Organic Fertilizer", ta: "மலம் → உரம் அல்லது உயிரியல் உரம்" }
    ],
    "Onion": [
        { en: "Peels → Bio-fertilizer", ta: "வெங்காய தோல் → உயிரியல் உரம்" },
        { en: "Waste → Biogas", ta: "மலம் → உயிரி வாயு" }
    ]
};

const stages = ["cropStage", "wasteStage", "wealthStage", "nextStage"];

document.getElementById("cropForm").addEventListener("submit", function(e){
    e.preventDefault();

    // Play mild sound
    const sound = document.getElementById("soundEffect");
    sound.currentTime = 0;
    sound.play();

    const form = e.target;
    const N = parseFloat(form.N.value);
    const P = parseFloat(form.P.value);
    const K = parseFloat(form.K.value);
    const temp = parseFloat(form.temperature.value);
    const hum = parseFloat(form.humidity.value);
    const ph = parseFloat(form.ph.value);
    const rain = parseFloat(form.rainfall.value);

    const crop = predictCrop(N, P, K, temp, hum, ph, rain);
    const options = wasteOptions[crop] || [{en: "No waste options available.", ta: "விருப்பங்கள் கிடைக்கவில்லை"}];

    let html = `<b>Recommended Crop:</b> ${crop}<br><b>Waste-to-Wealth Options:</b><br>`;
    options.forEach(opt => {
        html += `• ${opt.en} <br>• ${opt.ta}<br><br>`;
    });
    document.getElementById("result").innerHTML = html;

    // Animate stages glow
    let delay = 0;
    stages.forEach(id => {
        setTimeout(() => {
            stages.forEach(s => document.getElementById(s).classList.remove("active"));
            document.getElementById(id).classList.add("active");
        }, delay);
        delay += 1000;
    });

    // Add circular moving icons
    const wheel = document.getElementById("wheel");
    document.querySelectorAll(".resource").forEach(r => r.remove());
    const icons = ["🍃","♻️","💰"];
    icons.forEach((icon, i) => {
        const el = document.createElement("div");
        el.className = "resource";
        el.innerText = icon;
        el.style.animationDelay = `${i*0.5}s`;
        wheel.appendChild(el);
    });
});
</script>

</body>
</html>
